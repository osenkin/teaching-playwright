name: Playwright Tests inside Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env_name: [qauto, qauto2]
        include:
          - env_name: qauto
            url: https://qauto.forstudy.space
          - env_name: qauto2
            url: https://qauto2.forstudy.space

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Testing environment info
        run: echo "Starting parallel test run for ${{ matrix.env_name }}"

      - name: Run Playwright tests inside Docker container
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/work \
          -w /work \
          -e BASE_URL=${{ matrix.url }} \
          -e URL=${{ matrix.url }} \
          -e HTTP_USERNAME=${{ secrets.HTTP_USERNAME }} \
          -e HTTP_PASSWORD=${{ secrets.HTTP_PASSWORD }} \
          ://microsoft.com \
          /bin/sh -c "npm ci && npx playwright test"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env_name }}
          path: playwright-report/
          retention-days: 30

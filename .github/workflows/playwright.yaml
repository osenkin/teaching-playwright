name: Playwright Tests inside Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Запускаємо всю джобу всередині офіційного докер-контейнера Playwright від Microsoft
    container:
      image: ://microsoft.com

    strategy:
      fail-fast: false
      matrix:
        env_name: [qauto, qauto2]
        include:
          - env_name: qauto
            url: https://qauto.forstudy.space
          - env_name: qauto2
            url: https://qauto2.forstudy.space

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Testing environment info
        run: echo "Starting parallel test run for ${{ matrix.env_name }}"

      - name: Create .env file for environment
        run: |
          echo "BASE_URL=${{ matrix.url }}" >> .env.${{ matrix.env_name }}
          echo "HTTP_USERNAME=${{ secrets.HTTP_USERNAME }}" >> .env.${{ matrix.env_name }}
          echo "HTTP_PASSWORD=${{ secrets.HTTP_PASSWORD }}" >> .env.${{ matrix.env_name }}

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        env:
          ENV: ${{ matrix.env_name }}
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          target: host
          name: playwright-report-${{ matrix.env_name }}
          path: playwright-report/
          retention-days: 30

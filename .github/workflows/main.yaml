name: Playwright Tests inside Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: ://microsoft.com

    strategy:
      fail-fast: false
      matrix:
        env_name: [qauto, qauto2]
        include:
          - env_name: qauto
            url: https://qauto.forstudy.space
          - env_name: qauto2
            url: https://qauto2.forstudy.space

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Create .env file for environment
        run: |
          echo "BASE_URL=${{ matrix.url }}" >> .env.${{ matrix.env_name }}
          echo "HTTP_USERNAME=${{ secrets.HTTP_USERNAME }}" >> .env.${{ matrix.env_name }}
          echo "HTTP_PASSWORD=${{ secrets.HTTP_PASSWORD }}" >> .env.${{ matrix.env_name }}

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        env:
          ENV: ${{ matrix.env_name }}
        run: npx playwright test

      - uses: actions/upload-artifact@v3
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env_name }}
          path: playwright-report/
          retention-days: 30

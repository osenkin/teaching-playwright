# FORCE REFRESH v8 - CORRECT CLI SYNTAX
name: Playwright Tests inside Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env_file: [.env.qauto, .env.qauto2]
        include:
          - env_file: .env.qauto
            url: https://qauto.forstudy.space
          - env_file: .env.qauto2
            url: https://qauto2.forstudy.space

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Testing environment info
        run: echo "Starting parallel test run for ${{ matrix.env_file }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create Base Env File
        run: |
          echo "BASE_URL=${{ matrix.url }}" > .env
          echo "URL=${{ matrix.url }}" >> .env
          echo "HTTP_USERNAME=${{ secrets.HTTP_USERNAME }}" >> .env
          echo "HTTP_USERPASSWORD=${{ secrets.HTTP_USERPASSWORD }}" >> .env

          echo "BASE_URL=${{ matrix.url }}" > .env.qauto
          echo "HTTP_USERNAME=${{ secrets.HTTP_USERNAME }}" >> .env.qauto
          echo "HTTP_USERPASSWORD=${{ secrets.HTTP_USERPASSWORD }}" >> .env.qauto

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ matrix.url }}
          URL: ${{ matrix.url }}
          HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          HTTP_USERPASSWORD: ${{ secrets.HTTP_USERPASSWORD }}
          PLAYWRIGHT_HTTP_CREDENTIALS_USERNAME: ${{ secrets.HTTP_USERNAME }}
          PLAYWRIGHT_HTTP_CREDENTIALS_PASSWORD: ${{ secrets.HTTP_USERPASSWORD }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env_file }}
          path: playwright-report/
          retention-days: 30

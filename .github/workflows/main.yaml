# FORCE REFRESH v10 - NATIVE PRINTF WITH TIMEOUT
name: Playwright Tests inside Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env_file: [.env.qauto, .env.qauto2]
        include:
          - env_file: .env.qauto
            url: https://qauto.forstudy.space
          - env_file: .env.qauto2
            url: https://qauto2.forstudy.space

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Testing environment info
        run: echo "Starting parallel test run for \${{ matrix.env_file }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create Env Files
        run: |
          printf "BASE_URL=%s\nURL=%s\nHTTP_USERNAME=%s\nHTTP_USERPASSWORD=%s\n" " matrix.url " "{{ matrix.url }}" "\({{ secrets.HTTP_USERNAME }}" "\){{ secrets.HTTP_USERPASSWORD }}" > .env.qauto
          printf "BASE_URL=%s\nURL=%s\nHTTP_USERNAME=%s\nHTTP_USERPASSWORD=%s\n" " matrix.url " "{{ matrix.url }}" "\({{ secrets.HTTP_USERNAME }}" "\){{ secrets.HTTP_USERPASSWORD }}" > .env
          printf "BASE_URL=%s\nURL=%s\nHTTP_USERNAME=%s\nHTTP_USERPASSWORD=%s\n" "\${{ matrix.url }}" " matrix.url " "{{ secrets.HTTP_USERNAME }}" "\({{ secrets.HTTP_USERPASSWORD }}" > \){{ matrix.matrix.env_file }}

      - name: Run Playwright tests
        env:
          BASE_URL: \${{ matrix.url }}
          URL: \${{ matrix.url }}
          HTTP_USERNAME: \${{ secrets.HTTP_USERNAME }}
          HTTP_USERPASSWORD: \${{ secrets.HTTP_USERPASSWORD }}
        run: npx playwright test --timeout=60000

      - uses: actions/upload-artifact@v4
        if: \${{ !cancelled() }}
        with:
          name: playwright-report-\${{ matrix.env_file }}
          path: playwright-report/
          retention-days: 30

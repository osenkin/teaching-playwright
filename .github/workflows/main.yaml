# FORCE REFRESH v9 - OFFICIAL ENV GENERATOR
name: Playwright Tests inside Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env_file: [.env.qauto, .env.qauto2]
        include:
          - env_file: .env.qauto
            url: https://qauto.forstudy.space
          - env_file: .env.qauto2
            url: https://qauto2.forstudy.space

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Testing environment info
        run: echo "Starting parallel test run for ${{ matrix.env_file }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Make Matrix Env File
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_BASE_URL: ${{ matrix.url }}
          envkey_URL: ${{ matrix.url }}
          envkey_HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          envkey_HTTP_USERPASSWORD: ${{ secrets.HTTP_USERPASSWORD }}
          file_name: ${{ matrix.env_file }}
          fail_on_empty: true

      - name: Make Fallback Env File
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_BASE_URL: ${{ matrix.url }}
          envkey_URL: ${{ matrix.url }}
          envkey_HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          envkey_HTTP_USERPASSWORD: ${{ secrets.HTTP_USERPASSWORD }}
          file_name: .env.qauto
          fail_on_empty: true

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ matrix.url }}
          URL: ${{ matrix.url }}
          HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          HTTP_USERPASSWORD: ${{ secrets.HTTP_USERPASSWORD }}
        run: npx playwright test
